[workspace]


members = [
	"crates/resonix",
	"crates/resonix-audio",
	"crates/resonix-cli-tests",
	"crates/resonix-core",
	"crates/resonix-graph",
	"crates/resonix-gui",
	"crates/resonix-native",
	"crates/resonix-primitives",
	"crates/resonix-types",
	"crates/resonix-web",
	"scripts/compare-benchmarks",
	"scripts/build-wasm",
	"examples/wasm-plugin",
	"crates/resonix-wasm-audio-node", "crates/resonix-wasm-audio-node-macros",
]
default-members = [
	"crates/resonix",
	"crates/resonix-audio",
	"crates/resonix-cli-tests",
	"crates/resonix-core",
	"crates/resonix-graph",
	"crates/resonix-gui",
	"crates/resonix-native",
	"crates/resonix-primitives",
	"crates/resonix-types",
	"crates/resonix-web",
	"scripts/compare-benchmarks",
	"scripts/build-wasm",
	# exclude wasm crates from bare `cargo check` runs,
	# since they depend on target=wasm32-unknown-unknown configuration
]
resolver = "2"

[workspace.dependencies]
thiserror-no-std = "2.0.2"
wasm-bindgen = "0.2.104"
wasm-bindgen-test = "0.3.42"
