[package]
name = "resonix-graph"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# TODO: maybe replace with a compile-target-specific config (like wasmer)
# Enables outputting JS-env-specific dependencies (browser, node, deno, etc.)
js = ["dep:wasm-bindgen"]


[dependencies]
hashbrown = "0.15.3"
nohash-hasher = "0.2.0"
petgraph = "0.8.1"
bon = "3.9.1"
thiserror.workspace = true
wasm-bindgen = { workspace = true, optional = true }

# wasmer itself gates by compile target, so we need to enable
# different features depending on if compiling for wasm32 or not
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmer = { version = "7.1.0" }

# wasmer itself gates by compile target, so we need to enable
# different features depending on if compiling for wasm32 or not
[target.'cfg(target_arch = "wasm32")'.dependencies]
# TODO: may be able to get a slimmer build by disabling the js default feautures
wasmer = { version = "7.1.0", default-features = false, features = [
	"js-default",
] }


# TODO: may be able to get a slimmer build by disabling the some default feautures
# TODO maybe should enable production-grade compilers (like `llvm`)
[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
approx = "0.5.1"

[[bench]]
name = "graph"
harness = false
